<!DOCTYPE html>
<html>
<head>
    <title>Gun Shop - Login</title>
    <!-- Bootstrap for Style -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #212529; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #343a40; padding: 30px; border-radius: 15px; box-shadow: 0px 0px 20px rgba(255,0,0,0.2); width: 350px; }
        .btn-danger { width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4">Staff Login</h2>
        <form action="/login" method="POST">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="****" required>
            </div>
            <button type="submit" class="btn btn-danger">Login to System</button>
        </form>
    </div>
</body>
</html>
